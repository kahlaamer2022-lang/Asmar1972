<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Asmar 1972 - متجر الكتب الإلكترونية وقصص الأطفال</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
      line-height: 1.6;
    }
    header {
      background: #111827;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand-title { font-size: 20px; font-weight: bold; }
    .brand-sub { font-size: 13px; color: #d1d5db; }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .user-badge {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 13px;
    }
    .auth-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .lang-bar button {
      background: #374151;
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .lang-bar button.active { background: #059669; }
    .container { max-width: 1100px; margin: 22px auto; padding: 0 16px; }
    .notice-box {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      display: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .price { font-size: 17px; font-weight: bold; color: #047857; }
    .btn {
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-pay { background: #059669; color: #ffffff; width: 100%; }
    .btn-download {
      background: #d97706;
      color: #ffffff;
      margin-top: 8px;
      width: 100%;
    }
    .orders-box {
      margin-top: 28px;
      background: #ffffff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .order-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }
    .status-paid { color: #047857; font-weight: bold; }
    .status-pending { color: #b45309; font-weight: bold; }
    .status-cancelled { color: #b91c1c; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand-title" id="storeTitle">Asmar 1972</div>
      <div class="brand-sub" id="storeSub">كتب إلكترونية وقصص أطفال</div>
    </div>
    <div class="header-actions">
      <span id="piUserBadge" class="user-badge">ضيف / غير مسجّل</span>
      <button type="button" id="btnAuth" class="auth-btn" onclick="authenticatePiUser()">دخول Pi</button>
      <div class="lang-bar">
        <button type="button" id="btnAr" class="active" onclick="setLanguage('ar')">العربية</button>
        <button type="button" id="btnEn" onclick="setLanguage('en')">English</button>
        <button type="button" id="btnFr" onclick="setLanguage('fr')">Francais</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="browserNotice" class="notice-box"></div>

    <h2 id="catalogHeading">قائمة الكتب والقصص</h2>
    <div id="booksGrid" class="grid"></div>

    <section class="orders-box">
      <h2 id="ordersHeading">الطلبات وحالة الدفع والتحميل</h2>
      <div id="ordersList"></div>
    </section>
  </main>

  <script>
    var BOOKS_DATA = {
      dodo_story: {
        pricePi: 3,
        categoryAr: "قصص الأطفال",
        categoryEn: "Children Story",
        categoryFr: "Histoire Enfants",
        titleAr: "قصة دودو ودراجته الحمراء",
        titleEn: "Dodo and His Red Bicycle",
        titleFr: "Dodo et son Velo Rouge",
        descAr: "قصة مصورة ممتعة للأطفال حول المغامرة والاكتشاف.",
        descEn: "Fun illustrated story for children about adventure and discovery.",
        descFr: "Histoire illustree pour enfants sur l aventure et la decouverte.",
        downloadUrl: "https://example.com/dodo-story.pdf"
      },
      grandpa_nutrition: {
        pricePi: 5,
        categoryAr: "التغذية الطبيعية",
        categoryEn: "Natural Nutrition",
        categoryFr: "Nutrition Naturelle",
        titleAr: "حكمة الأجداد في التغذية",
        titleEn: "Ancestors Wisdom in Nutrition",
        titleFr: "Sagesse des Ancetres en Nutrition",
        descAr: "دليل عملي مستلهم من التقاليد الغذائية والعادات الصحية المتوازنة.",
        descEn: "Practical guide inspired by balanced dietary traditions.",
        descFr: "Guide pratique inspire des traditions alimentaires saines.",
        downloadUrl: "https://example.com/grandpa-nutrition.pdf"
      },
      nutrition_tips: {
        pricePi: 4,
        categoryAr: "الصحة والتغذية",
        categoryEn: "Health & Nutrition",
        categoryFr: "Sante et Nutrition",
        titleAr: "نصائح في التغذية",
        titleEn: "Nutrition Tips",
        titleFr: "Conseils en Nutrition",
        descAr: "إرشادات يومية مبسطة لاختيار الأغذية المناسبة وتنظيم الوجبات.",
        descEn: "Simple daily guidelines for healthy food choices.",
        descFr: "Conseils quotidiens simples pour une alimentation equilibree.",
        downloadUrl: "https://example.com/nutrition-tips.pdf"
      },
      construction_calc: {
        pricePi: 6,
        categoryAr: "أدوات ومشاريع",
        categoryEn: "Projects & Tools",
        categoryFr: "Projets et Outils",
        titleAr: "حاسبة مشاريع البناء",
        titleEn: "Construction Projects Calculator",
        titleFr: "Calculateur Projets Construction",
        descAr: "مرجع عملي لحساب وتقدير متطلبات مشاريع البناء بوضوح.",
        descEn: "Practical guide for estimating building project needs.",
        descFr: "Guide pratique pour estimer les besoins de construction.",
        downloadUrl: "https://example.com/construction-calc.pdf"
      },
      amer_hero: {
        pricePi: 3,
        categoryAr: "قصص الأطفال",
        categoryEn: "Children Story",
        categoryFr: "Histoire Enfants",
        titleAr: "عامر البطل الصغير",
        titleEn: "Amer the Little Hero",
        titleFr: "Amer le Petit Heros",
        descAr: "مغامرة شيقة للناشئة حول الشجاعة والتعاون وحسن التصرف.",
        descEn: "Engaging story for kids about courage and teamwork.",
        descFr: "Recit captivant sur le courage et l entraide.",
        downloadUrl: "https://example.com/amer-hero.pdf"
      },
      amer_moto: {
        pricePi: 3,
        categoryAr: "قصص الأطفال",
        categoryEn: "Children Story",
        categoryFr: "Histoire Enfants",
        titleAr: "عامر وبطولة الدراجة النارية",
        titleEn: "Amer and the Motorcycle Championship",
        titleFr: "Amer et le Championnat de Moto",
        descAr: "قصة حماسية مليئة بالتشويق والدروس المفيدة للأطفال.",
        descEn: "Exciting story full of suspense and useful lessons.",
        descFr: "Histoire passionnante pleine de lecons utiles.",
        downloadUrl: "https://example.com/amer-moto.pdf"
      },
      amer_stars: {
        pricePi: 3,
        categoryAr: "قصص الأطفال",
        categoryEn: "Children Story",
        categoryFr: "Histoire Enfants",
        titleAr: "عامر وليلة النجوم عند الجدة",
        titleEn: "Amer and the Night of Stars at Grandma",
        titleFr: "Amer et la Nuit des Etoiles chez Grand-Mere",
        descAr: "حكاية دافئة تجمع بين دفء العائلة وجمال الطبيعة ليلاً.",
        descEn: "Warm tale combining family warmth and starry nights.",
        descFr: "Conte chaleureux entre famille et nuit etoilee.",
        downloadUrl: "https://example.com/amer-stars.pdf"
      },
      fun_trio: {
        pricePi: 4,
        categoryAr: "قصص الأطفال",
        categoryEn: "Children Story",
        categoryFr: "Histoire Enfants",
        titleAr: "مغامرات الثلاثي المرح",
        titleEn: "Adventures of the Fun Trio",
        titleFr: "Aventures du Trio Joyeux",
        descAr: "ثلاثة أصدقاء يخوضون مواقف طريفة ومفيدة في كل محطة.",
        descEn: "Three friends sharing funny and helpful adventures.",
        descFr: "Trois amis dans des aventures joyeuses et instructives.",
        downloadUrl: "https://example.com/fun-trio.pdf"
      },
      humayma_bidah: {
        pricePi: 5,
        categoryAr: "قصص وحكم",
        categoryEn: "Stories & Wisdom",
        categoryFr: "Contes et Sagesse",
        titleAr: "هميمة وبدعة - بريق الذهب وصدى الواجب -",
        titleEn: "Humayma and Bidah: Gold Gleam & Echo of Duty",
        titleFr: "Houmayma et Bidah : Eclat d Or et Echo du Devoir",
        descAr: "عمل قصصي يبرز قيمة الأمانة والواجب أمام بريق المظاهر.",
        descEn: "Story highlighting duty and sincerity beyond appearances.",
        descFr: "Recit mettant en valeur le devoir au-dela des apparences.",
        downloadUrl: "https://example.com/humayma-bidah.pdf"
      }
    };

    var STORAGE_KEY = "asmar1972_orders_v1";
    var currentLang = "ar";
    var currentPiUser = null;
    var ordersList = loadOrders();

    window.addEventListener("unhandledrejection", function(event) {
      var msg = event && event.reason ? String(event.reason.message || event.reason) : "";
      if (msg.indexOf("timed out") !== -1 || msg.indexOf("Messaging") !== -1) {
        event.preventDefault();
        console.log("Pi SDK timeout handled outside Pi Browser:", msg);
      }
    });

    if (window.Pi && typeof window.Pi.init === "function") {
      try {
        window.Pi.init({ version: "2.0", sandbox: false });
      } catch (err) {
        console.log("Pi init note:", err);
      }
    }

    function isLikelyPiBrowser() {
      var ua = navigator.userAgent || "";
      return ua.indexOf("PiBrowser") !== -1;
    }

    function loadOrders() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        return [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ordersList));
      } catch (e) {
        console.log("Save orders note:", e);
      }
    }

    function getBookTitle(book) {
      if (!book) return "";
      if (currentLang === "en") return book.titleEn;
      if (currentLang === "fr") return book.titleFr;
      return book.titleAr;
    }

    function getBookDesc(book) {
      if (!book) return "";
      if (currentLang === "en") return book.descEn;
      if (currentLang === "fr") return book.descFr;
      return book.descAr;
    }

    function getBookCategory(book) {
      if (!book) return "";
      if (currentLang === "en") return book.categoryEn;
      if (currentLang === "fr") return book.categoryFr;
      return book.categoryAr;
    }

    function getText(key) {
      var dict = {
        ar: {
          dir: "rtl",
          sub: "كتب إلكترونية وقصص أطفال",
          guest: "ضيف / غير مسجّل",
          authBtn: "دخول Pi",
          notice: "ملاحظة: يبدو أنك تتصفح خارج Pi Browser. لإتمام الدفع الفعلي عبر Pi، افتح الرابط من داخل Pi Browser.",
          catalog: "قائمة الكتب والقصص",
          orders: "الطلبات وحالة الدفع والتحميل",
          orderBtn: "طلب الإصدار",
          downloadBtn: "تحميل / فتح الكتاب",
          paidText: "مدفوع ومفعّل",
          pendingText: "بانتظار إتمام الدفع عبر Pi",
          cancelledText: "تم إلغاء الدفع أو تعذّر إتمامه",
          noOrders: "لا توجد طلبات مسجلة حتى الآن.",
          orderIdLabel: "رقم الطلب",
          bookLabel: "الكتاب",
          priceLabel: "السعر"
        },
        en: {
          dir: "ltr",
          sub: "E-Books and Children Stories",
          guest: "Guest / Signed out",
          authBtn: "Pi Login",
          notice: "Note: You appear to be outside Pi Browser. Open this link inside Pi Browser to complete real Pi payments.",
          catalog: "Books & Stories Catalog",
          orders: "Orders, Payment Status & Download",
          orderBtn: "Request Edition",
          downloadBtn: "Download / Open Book",
          paidText: "Paid & Unlocked",
          pendingText: "Pending Pi Payment Completion",
          cancelledText: "Payment cancelled or failed",
          noOrders: "No orders recorded yet.",
          orderIdLabel: "Order ID",
          bookLabel: "Book",
          priceLabel: "Price"
        },
        fr: {
          dir: "ltr",
          sub: "Livres Numeriques et Histoires Enfants",
          guest: "Invite / Non connecte",
          authBtn: "Connexion Pi",
          notice: "Note : Vous semblez hors de Pi Browser. Ouvrez ce lien dans Pi Browser pour effectuer un paiement Pi reel.",
          catalog: "Catalogue Livres et Histoires",
          orders: "Commandes, Paiement et Telechargement",
          orderBtn: "Commander l Edition",
          downloadBtn: "Telecharger / Ouvrir le Livre",
          paidText: "Paye et Debloque",
          pendingText: "En attente de finalisation Pi",
          cancelledText: "Paiement annule ou echoue",
          noOrders: "Aucune commande enregistree pour le moment.",
          orderIdLabel: "Commande",
          bookLabel: "Livre",
          priceLabel: "Prix"
        }
      };
      var langSet = dict.ar;
      if (currentLang === "en") langSet = dict.en;
      if (currentLang === "fr") langSet = dict.fr;
      return langSet[key];
    }

    function updateUserBadge() {
      var badge = document.getElementById("piUserBadge");
      if (!badge) return;
      if (currentPiUser && currentPiUser.username) {
        badge.textContent = "@" + currentPiUser.username;
      } else {
        badge.textContent = getText("guest");
      }
    }

    function authenticatePiUser() {
      if (!isLikelyPiBrowser() || !window.Pi || typeof window.Pi.authenticate !== "function") {
        console.log("Pi authenticate not available outside Pi Browser.");
        return Promise.resolve(null);
      }

      return window.Pi.authenticate(["username", "payments"], function(incompletePayment) {
        console.log("Incomplete payment found:", incompletePayment);
      })
      .then(function(auth) {
        if (auth && auth.user) {
          currentPiUser = auth.user;
          updateUserBadge();
        }
        return auth;
      })
      .catch(function(err) {
        console.log("Pi authenticate note:", err);
        return null;
      });
    }

    function updateBrowserNotice() {
      var noticeEl = document.getElementById("browserNotice");
      if (!noticeEl) return;
      if (!isLikelyPiBrowser()) {
        noticeEl.textContent = getText("notice");
        noticeEl.style.display = "block";
      } else {
        noticeEl.style.display = "none";
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = getText("dir");

      document.getElementById("btnAr").className = (lang === "ar") ? "active" : "";
      document.getElementById("btnEn").className = (lang === "en") ? "active" : "";
      document.getElementById("btnFr").className = (lang === "fr") ? "active" : "";

      document.getElementById("storeSub").textContent = getText("sub");
      document.getElementById("btnAuth").textContent = getText("authBtn");
      document.getElementById("catalogHeading").textContent = getText("catalog");
      document.getElementById("ordersHeading").textContent = getText("orders");

      updateUserBadge();
      updateBrowserNotice();
      renderBooks();
      renderOrdersList();
    }

    function buildDownloadButtonHtml(bookKey) {
      var book = BOOKS_DATA[bookKey];
      if (!book) return "";
      var rawUrl = book.downloadUrl ? String(book.downloadUrl) : "";
      var cleanUrl = rawUrl.trim();
      if (cleanUrl === "") return "";

      return "<a class='btn btn-download' href='" + cleanUrl + "' target='_blank' rel='noopener noreferrer'>" + getText("downloadBtn") + "</a>";
    }

    function updateOrderStatus(orderId, status) {
      var i = 0;
      for (i = 0; i < ordersList.length; i++) {
        if (ordersList[i].id === orderId) {
          ordersList[i].status = status;
          ordersList[i].paid = (status === "paid");
          break;
        }
      }
      saveOrders();
      renderOrdersList();
    }

    function createOrderAndPay(bookKey) {
      var book = BOOKS_DATA[bookKey];
      if (!book) return;

      var newOrder = {
        id: "ORD-" + String(Date.now()),
        bookKey: bookKey,
        pricePi: book.pricePi,
        status: "pending",
        paid: false
      };

      ordersList.unshift(newOrder);
      saveOrders();
      renderOrdersList();

      if (!isLikelyPiBrowser()) {
        console.log("Opened outside Pi Browser. Order saved as pending:", newOrder.id);
        return;
      }

      if (window.Pi && typeof window.Pi.createPayment === "function") {
        var startPayment = function() {
          try {
            window.Pi.createPayment(
              {
                amount: book.pricePi,
                memo: getBookTitle(book),
                metadata: { orderId: newOrder.id, bookKey: bookKey }
              },
              {
                onReadyForServerApproval: function(paymentId) {
                  fetch("/api/pi/approve", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ paymentId: paymentId })
                  })
                  .then(function(res) { return res.json(); })
                  .then(function(data) { console.log("Approve result:", data); })
                  .catch(function(err) { console.log("Approve error:", err); });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                  fetch("/api/pi/complete", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ paymentId: paymentId, txid: txid })
                  })
                  .then(function(res) { return res.json(); })
                  .then(function(data) {
                    console.log("Complete result:", data);
                    if (data && data.ok) {
                      updateOrderStatus(newOrder.id, "paid");
                    }
                  })
                  .catch(function(err) { console.log("Complete error:", err); });
                },
                onCancel: function() {
                  console.log("Payment cancelled");
                  updateOrderStatus(newOrder.id, "cancelled");
                },
                onError: function(error) {
                  console.log("Pi payment note:", error);
                  updateOrderStatus(newOrder.id, "cancelled");
                }
              }
            );
          } catch (err) {
            console.log("Pi createPayment note:", err);
          }
        };

        if (!currentPiUser) {
          authenticatePiUser().then(function() {
            startPayment();
          });
        } else {
          startPayment();
        }
      } else {
        console.log("Pi SDK not active in current browser. Order ID:", newOrder.id);
      }
    }

    function renderBooks() {
      var grid = document.getElementById("booksGrid");
      if (!grid) return;

      var html = "";
      var keys = Object.keys(BOOKS_DATA);
      var i = 0;
      for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var book = BOOKS_DATA[key];
        html += "<div class='card'>";
        html += "<div>";
        html += "<span class='badge'>" + getBookCategory(book) + "</span>";
        html += "<h3>" + getBookTitle(book) + "</h3>";
        html += "<p>" + getBookDesc(book) + "</p>";
        html += "</div>";
        html += "<div>";
        html += "<div class='price'>" + book.pricePi + " Pi</div>";
        html += "<button type='button' class='btn btn-pay' onclick=\"createOrderAndPay('" + key + "')\">" + getText("orderBtn") + " (" + book.pricePi + " Pi)</button>";
        html += "</div>";
        html += "</div>";
      }
      grid.innerHTML = html;
    }

    function renderOrdersList() {
      var container = document.getElementById("ordersList");
      if (!container) return;

      if (ordersList.length === 0) {
        container.innerHTML = "<p>" + getText("noOrders") + "</p>";
        return;
      }

      var html = "";
      var i = 0;
      for (i = 0; i < ordersList.length; i++) {
        var order = ordersList[i];
        var book = BOOKS_DATA[order.bookKey];
        var bookTitle = book ? getBookTitle(book) : order.bookKey;
        var currentStatus = order.status || (order.paid ? "paid" : "pending");

        html += "<div class='order-item'>";
        html += "<div><strong>" + getText("orderIdLabel") + ":</strong> " + order.id + "</div>";
        html += "<div><strong>" + getText("bookLabel") + ":</strong> " + bookTitle + "</div>";
        html += "<div><strong>" + getText("priceLabel") + ":</strong> " + order.pricePi + " Pi</div>";

        if (currentStatus === "paid") {
          html += "<div class='status-paid'>" + getText("paidText") + "</div>";
          html += buildDownloadButtonHtml(order.bookKey);
        } else if (currentStatus === "cancelled") {
          html += "<div class='status-cancelled'>" + getText("cancelledText") + "</div>";
        } else {
          html += "<div class='status-pending'>" + getText("pendingText") + "</div>";
        }

        html += "</div>";
      }

      container.innerHTML = html;
    }

    setLanguage("ar");
    if (isLikelyPiBrowser()) {
      authenticatePiUser();
    }
  </script>
</body>
</html>
