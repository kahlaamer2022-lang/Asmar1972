<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asmar 1972 - متجر الكتب الإلكترونية وقصص الأطفال</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
      line-height: 1.6;
    }
    header {
      background: #111827;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand-title { font-size: 20px; font-weight: bold; }
    .brand-sub { font-size: 13px; color: #d1d5db; }
    .lang-bar button {
      background: #374151;
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .lang-bar button.active { background: #059669; }
    .container { max-width: 1100px; margin: 22px auto; padding: 0 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .price { font-size: 17px; font-weight: bold; color: #047857; }
    .btn {
      border: none;
      border-radius: 7px;
      padding: 9px 13px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-pay { background: #059669; color: #ffffff; width: 100%; }
    .btn-download {
      background: #d97706;
      color: #ffffff;
      margin-top: 8px;
      width: 100%;
    }
    .orders-box {
      margin-top: 28px;
      background: #ffffff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .order-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }
    .status-paid { color: #047857; font-weight: bold; }
    .status-pending { color: #b45309; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand-title" id="storeTitle">Asmar 1972</div>
      <div class="brand-sub" id="storeSub">كتب إلكترونية وقصص أطفال</div>
    </div>
    <div class="lang-bar">
      <button type="button" id="btnAr" class="active" onclick="setLanguage('ar')">العربية</button>
      <button type="button" id="btnEn" onclick="setLanguage('en')">English</button>
      <button type="button" id="btnFr" onclick="setLanguage('fr')">Francais</button>
    </div>
  </header>

  <main class="container">
    <h2 id="catalogHeading">قائمة الكتب والقصص</h2>
    <div id="booksGrid" class="grid"></div>

    <section class="orders-box">
      <h2 id="ordersHeading">الطلبات وحالة الدفع والتحميل</h2>
      <div id="ordersList"></div>
    </section>
  </main>

        descEn: "Three friends sharing funny and helpful adventures.",

      },
      humayma_bidah: {
        pricePi: 5,

        categoryEn: "Stories & Wisdom",
        categoryFr: "Contes et Sagesse",

        titleEn: "Humayma and Bidah: Gold Gleam & Echo of Duty",
        titleFr: "Houmayma et Bidah : Eclat d Or et Echo du Devoir",
        descAr: "عمل قصصي يبرز قيمة الأمانة والواجب أمام بريق المظاهر.",
        descEn: "Story highlighting duty and sincerity beyond appearances.",

      }
    };

    var STORAGE_KEY = "asmar1972_orders_v1";
    var currentLang = "ar";
    var ordersList = loadOrders();

    if (window.Pi && typeof window.Pi.init === "function") {
      try {
        window.Pi.init({ version: "2.0", sandbox: false });
      } catch (err) {
        console.log("Pi init note:", err);
      }
    }

    function loadOrders() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        return [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ordersList));
      } catch (e) {
        console.log("Save orders note:", e);
      }
    }

    function getBookTitle(book) {
      if (!book) return "";
      if (currentLang === "en") return book.titleEn;
      if (currentLang === "fr") return book.titleFr;
      return book.titleAr;
    }

    function getBookDesc(book) {
      if (!book) return "";
      if (currentLang === "en") return book.descEn;
      if (currentLang === "fr") return book.descFr;
      return book.descAr;
    }

    function getBookCategory(book) {
      if (!book) return "";
      if (currentLang === "en") return book.categoryEn;
      if (currentLang === "fr") return book.categoryFr;
      return book.categoryAr;
    }

    function getText(key) {
      var dict = {
        ar: {
          dir: "rtl",
          sub: "كتب إلكترونية وقصص أطفال",
          catalog: "قائمة الكتب والقصص",
          orders: "الطلبات وحالة الدفع والتحميل",
          orderBtn: "طلب الإصدار",
          downloadBtn: "تحميل / فتح الكتاب",
          paidText: "مدفوع ومفعّل",
          pendingText: "بانتظار إتمام الدفع عبر Pi",
          noOrders: "لا توجد طلبات مسجلة حتى الآن.",
          orderIdLabel: "رقم الطلب",
          bookLabel: "الكتاب",
          priceLabel: "السعر"
        },
        en: {
          dir: "ltr",
          sub: "E-Books and Children Stories",
          catalog: "Books & Stories Catalog",
          orders: "Orders, Payment Status & Download",
          orderBtn: "Request Edition",
          downloadBtn: "Download / Open Book",
          paidText: "Paid & Unlocked",
          pendingText: "Pending Pi Payment Completion",
          noOrders: "No orders recorded yet.",
          orderIdLabel: "Order ID",
          bookLabel: "Book",
          priceLabel: "Price"
        },
        fr: {
          dir: "ltr",
          sub: "Livres Numeriques et Histoires Enfants",
          catalog: "Catalogue Livres et Histoires",
orders: "Commandes, Paiement et Telechargement",
          orderBtn: "Commander l Edition",
          downloadBtn: "Telecharger / Ouvrir le Livre",
          paidText: "Paye et Debloque",
          pendingText: "En attente de finalisation Pi",
          noOrders: "Aucune commande enregistree pour le moment.",
          orderIdLabel: "Commande",
          bookLabel: "Livre",
          priceLabel: "Prix"
        }
      };
      var langSet = dict.ar;
      if (currentLang === "en") langSet = dict.en;
      if (currentLang === "fr") langSet = dict.fr;
      return langSet[key];
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = getText("dir");

      document.getElementById("btnAr").className = (lang === "ar") ? "active" : "";
      document.getElementById("btnEn").className = (lang === "en") ? "active" : "";
      document.getElementById("btnFr").className = (lang === "fr") ? "active" : "";

      document.getElementById("storeSub").textContent = getText("sub");
      document.getElementById("catalogHeading").textContent = getText("catalog");
      document.getElementById("ordersHeading").textContent = getText("orders");

      renderBooks();
      renderOrdersList();
    }

    function buildDownloadButtonHtml(bookKey) {
      var book = BOOKS_DATA[bookKey];
      if (!book) return "";
      var rawUrl = book.downloadUrl ? String(book.downloadUrl) : "";
      var cleanUrl = rawUrl.trim();
      if (cleanUrl === "") return "";

      return "<a class='btn btn-download' href='" + cleanUrl + "' target='_blank' rel='noopener noreferrer'>" + getText("downloadBtn") + "</a>";
    }

    function createOrderAndPay(bookKey) {
      var book = BOOKS_DATA[bookKey];
      if (!book) return;

      var newOrder = {
        id: "ORD-" + String(Date.now()),
        bookKey: bookKey,
        pricePi: book.pricePi,
        paid: false
      };

      ordersList.unshift(newOrder);
      saveOrders();
      renderOrdersList();

      if (window.Pi && typeof window.Pi.createPayment === "function") {
        try {
          window.Pi.createPayment(
            {
              amount: book.pricePi,
              memo: getBookTitle(book),
              metadata: { orderId: newOrder.id, bookKey: bookKey }
            },
            {
              onReadyForServerApproval: function(paymentId) {
                console.log("Ready for approval:", paymentId);
              },
              onReadyForServerCompletion: function(paymentId, txid) {
                console.log("Completed:", paymentId, txid);
                markOrderPaid(newOrder.id);
              },
              onCancel: function() {
                console.log("Payment cancelled");
              },
              onError: function(error) {
                console.log("Pi payment note:", error);
              }
            }
          );
        } catch (err) {
          console.log("Pi createPayment note:", err);
        }
      } else {
        console.log("Pi SDK not active in current browser. Order ID:", newOrder.id);
      }
    }

    function markOrderPaid(orderId) {
      var i = 0;
      for (i = 0; i < ordersList.length; i++) {
        if (ordersList[i].id === orderId) {
          ordersList[i].paid = true;
          break;
        }
      }
      saveOrders();
      renderOrdersList();
    }

    function renderBooks() {
      var grid = document.getElementById("booksGrid");
      if (!grid) return;

      var html = "";
      var keys = Object.keys(BOOKS_DATA);
      var i = 0;
      for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var book = BOOKS_DATA[key];
        html += "<div class='card'>";
        html += "<div>";
        html += "<span class='badge'>" + getBookCategory(book) + "</span>";
html += "<h3>" + getBookTitle(book) + "</h3>";
        html += "<p>" + getBookDesc(book) + "</p>";
        html += "</div>";
        html += "<div>";
        html += "<div class='price'>" + book.pricePi + " Pi</div>";
        html += "<button type='button' class='btn btn-pay' onclick=\"createOrderAndPay('" + key + "')\">" + getText("orderBtn") + " (" + book.pricePi + " Pi)</button>";
        html += "</div>";
