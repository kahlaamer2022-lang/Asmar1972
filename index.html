    .notice-box {

      border-radius: 8px;

      display: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .price { font-size: 17px; font-weight: bold; color: #047857; }
    .btn {
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .btn-pay { background: #059669; color: #ffffff; width: 100%; }
    .btn-download {
      background: #d97706;
      color: #ffffff;
      margin-top: 10px;
      width: 100%;
      font-size: 15px;
      padding: 12px 16px;
      border: 2px solid #b45309;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
    }
    .btn-download:hover {
      background: #b45309;
    }
    .orders-box {
      margin-top: 28px;
      background: #ffffff;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .order-item {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      background: #fafafa;
    }
    .order-item-paid {

    }

    function isPiSdkMessagingTimeoutError(errOrMsg) {
      var text = "";
      if (!errOrMsg) return false;
      if (typeof errOrMsg === "string") {
        text = errOrMsg;
      } else if (errOrMsg.message) {
        text = String(errOrMsg.message);
      } else {
        text = String(errOrMsg);
      }
      return text.indexOf("timed out") !== -1 || text.indexOf("Messaging") !== -1;
    }

    window.addEventListener("unhandledrejection", function(event) {
      var reason = event ? event.reason : null;
      if (isPiSdkMessagingTimeoutError(reason)) {
        event.preventDefault();
        console.log("Pi SDK timeout handled outside Pi Browser:", reason);
      }
    });

    window.onerror = function(message, source, lineno, colno, error) {
      if (isPiSdkMessagingTimeoutError(message) || isPiSdkMessagingTimeoutError(error)) {
        console.log("Pi SDK error suppressed outside Pi Browser:", message);
        return true;
      }
      return false;
    };

    if (window.Pi && typeof window.Pi.init === "function") {
      try {
        window.Pi.init({ version: "2.0", sandbox: false });
      } catch (err) {
        console.log("Pi init note:", err);
      }
    }

    function isLikelyPiBrowser() {
      var ua = navigator.userAgent || "";
      return ua.indexOf("PiBrowser") !== -1 || ua.indexOf("Pi Browser") !== -1;
    }

    function loadOrders() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        return [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ordersList));
      } catch (e) {

    function updateUserBadge() {
      var badge = document.getElementById("piUserBadge");
      if (!badge) return;
      if (currentPiUser && currentPiUser.username) {
        badge.textContent = "@" + currentPiUser.username;
      } else {
        badge.textContent = getText("guest");
      }
    }

    function authenticatePiUser(options) {
      var silent = options && options.silent === true;
      var badge = document.getElementById("piUserBadge");

      if (!window.Pi || typeof window.Pi.authenticate !== "function") {
        updateUserBadge();
        if (!silent) {
          alert(getText("sdkNotReady"));
        }
        return Promise.resolve(null);
      }

      if (badge) {
        badge.textContent = getText("signingIn");
      }

      var settled = false;
      var uiTimer = setTimeout(function() {
        if (!settled && !currentPiUser) {
          updateUserBadge();
        }
      }, 8000);

      try {
        var authPromise = window.Pi.authenticate(["username", "payments"], function(incompletePayment) {
          console.log("Incomplete payment found:", incompletePayment);
        });

        if (authPromise && typeof authPromise.catch === "function") {
          authPromise.catch(function(err) {
            console.log("Pi SDK background auth rejection:", err);
          });
        }

        return authPromise
          .then(function(auth) {
            settled = true;
            clearTimeout(uiTimer);
            if (auth && auth.user) {
              currentPiUser = auth.user;
            }
            updateUserBadge();
            return auth;
          })
          .catch(function(err) {
            settled = true;
            clearTimeout(uiTimer);
            console.log("Pi authenticate note:", err);
            updateUserBadge();
            if (!silent) {
              alert(getText("authFailed"));
            }
            return null;
          });
      } catch (err) {
        settled = true;
        clearTimeout(uiTimer);
        console.log("Pi authenticate exception:", err);
        updateUserBadge();
        if (!silent) {
          alert(getText("authFailed"));
        }
        return Promise.resolve(null);
      }
    }

    function getCleanDownloadUrl(bookKey) {
      var book = BOOKS_DATA[bookKey];
      if (!book || !book.downloadUrl) return "";
      return String(book.downloadUrl).trim();
    }

    function openBookAutomatically(bookKey) {
      var cleanUrl = getCleanDownloadUrl(bookKey);
      if (!cleanUrl) return;
      try {
        var openedWin = window.open(cleanUrl, "_blank", "noopener,noreferrer");
        if (!openedWin) {
          window.location.href = cleanUrl;
        }
      } catch (e) {
        window.location.href = cleanUrl;
      }
    }

    function buildDownloadButtonHtml(bookKey) {
      var cleanUrl = getCleanDownloadUrl(bookKey);
      if (cleanUrl === "") return "";

      return "<a class='btn btn-download' href='" + cleanUrl + "' target='_blank' rel='noopener noreferrer'>" + getText("downloadBtn") + "</a>";
    }

    function updateOrderStatus(orderId, status) {
      var i = 0;
      var matchedBookKey = null;
      for (i = 0; i < ordersList.length; i++) {
        if (ordersList[i].id === orderId) {
          ordersList[i].status = status;
          ordersList[i].paid = (status === "paid");
          matchedBookKey = ordersList[i].bookKey;
          break;
        }
      }
      saveOrders();
      renderOrdersList();

      if (status === "paid" && matchedBookKey) {
        openBookAutomatically(matchedBookKey);
      }
    }

    function isCompleteResponseSuccess(res, data) {
      if (!res || !res.ok) return false;
      if (!data) return true;
      if (data.ok === false || data.success === false || data.error) return false;
      return true;
    }

    function createOrderAndPay(bookKey) {
      var book = BOOKS_DATA[bookKey];
      if (!book) return;

      var newOrder = {
        id: "ORD-" + String(Date.now()),
        bookKey: bookKey,
        pricePi: book.pricePi,
        status: "pending",
        paid: false
      };

      ordersList.unshift(newOrder);
      saveOrders();
      renderOrdersList();

      if (window.Pi && typeof window.Pi.createPayment === "function") {
        var startPayment = function() {
          try {
            var payPromise = window.Pi.createPayment(
              {
                amount: book.pricePi,
                memo: getBookTitle(book),
                metadata: { orderId: newOrder.id, bookKey: bookKey }
              },
              {
                onReadyForServerApproval: function(paymentId) {
                  fetch("/api/pi/approve", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ paymentId: paymentId })
                  })
                  .then(function(res) { return res.json().catch(function() { return {}; }); })
                  .then(function(data) { console.log("Approve result:", data); })
                  .catch(function(err) { console.log("Approve error:", err); });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                  var responseObj = null;
                  fetch("/api/pi/complete", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ paymentId: paymentId, txid: txid })
                  })
                  .then(function(res) {
                    responseObj = res;
                    return res.json().catch(function() { return {}; });
                  })
                  .then(function(data) {
                    console.log("Complete result:", data);
                    if (isCompleteResponseSuccess(responseObj, data)) {
                      updateOrderStatus(newOrder.id, "paid");
                    }
                  })
                  .catch(function(err) { console.log("Complete error:", err); });
                },
                onCancel: function() {
                  console.log("Payment cancelled");
                  updateOrderStatus(newOrder.id, "cancelled");
                },
                onError: function(error) {
                  console.log("Pi payment note:", error);
                  updateOrderStatus(newOrder.id, "cancelled");
                }
              }
            );

            if (payPromise && typeof payPromise.catch === "function") {
              payPromise.catch(function(err) {
                console.log("Pi createPayment promise note:", err);
              });
            }
          } catch (err) {
            console.log("Pi createPayment note:", err);
          }
        };

        if (!currentPiUser) {
          authenticatePiUser({ silent: false }).then(function(auth) {
            if (auth && auth.user) {
              startPayment();
            }
          });
        } else {
          startPayment();
        }
      } else {
        console.log("Pi SDK not active in current browser. Order ID:", newOrder.id);
      }
    }

    function renderBooks() {
      var grid = document.getElementById("booksGrid");
      if (!grid) return;

      var html = "";
      var keys = Object.keys(BOOKS_DATA);
      var i = 0;
      for (i = 0; i < keys.length; i++) {
        var key = keys[i];
        var book = BOOKS_DATA[key];
        html += "<div class='card'>";
        html += "<div>";
        html += "<span class='badge'>" + getBookCategory(book) + "</span>";
        html += "<h3>" + getBookTitle(book) + "</h3>";
        html += "<p>" + getBookDesc(book) + "</p>";
        html += "</div>";
        html += "<div>";
        html += "<div class='price'>" + book.pricePi + " Pi</div>";
        html += "<button type='button' class='btn btn-pay' onclick=\"createOrderAndPay('" + key + "')\">" + getText("orderBtn") + " (" + book.pricePi + " Pi)</button>";
        html += "</div>";
        html += "</div>";
      }
      grid.innerHTML = html;
    }

    function renderOrdersList() {
      var container = document.getElementById("ordersList");
      if (!container) return;

      if (ordersList.length === 0) {
        container.innerHTML = "<p>" + getText("noOrders") + "</p>";
        return;
      }

      var html = "";
      var i = 0;
      for (i = 0; i < ordersList.length; i++) {
        var order = ordersList[i];
        var book = BOOKS_DATA[order.bookKey];
        var bookTitle = book ? getBookTitle(book) : order.bookKey;
        var currentStatus = order.status || (order.paid ? "paid" : "pending");
        var itemClass = (currentStatus === "paid") ? "order-item order-item-paid" : "order-item";

        html += "<div class='" + itemClass + "'>";
        html += "<div><strong>" + getText("orderIdLabel") + ":</strong> " + order.id + "</div>";
        html += "<div><strong>" + getText("bookLabel") + ":</strong> " + bookTitle + "</div>";
        html += "<div><strong>" + getText("priceLabel") + ":</strong> " + order.pricePi + " Pi</div>";

        if (currentStatus === "paid") {
          html += "<div class='status-paid'>" + getText("paidText") + "</div>";
          html += buildDownloadButtonHtml(order.bookKey);
        } else if (currentStatus === "cancelled") {
          html += "<div class='status-cancelled'>" + getText("cancelledText") + "</div>";
        } else {
          html += "<div class='status-pending'>" + getText("pendingText") + "</div>";
        }

        html += "</div>";
      }

      container.innerHTML = html;
    }

    function initApp() {
      setLanguage("ar");
      if (isLikelyPiBrowser() && window.Pi && typeof window.Pi.authenticate === "function") {
        authenticatePiUser({ silent: true });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
